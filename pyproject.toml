[build-system]
requires = [
  # Using an upperbound pin to prevent sudden breakage.
  # Since we're using a deprecated feature of setuptools, it could be removed in a major update.
  "setuptools >=64,<85", # PEP 660 editable installs
  "setuptools-scm >=9.2", # dev versions use the commit's UTC date, like the tag workflow
]
build-backend = "setuptools.build_meta"

[project]
name = "Beslogic-Ruff-Config"
dynamic = ["version"] # From the CalVer git tag, see .github/workflows/calver-tag.yml
license = { file = "LICENSE" }
description = "Ruff rules and configs used at Beslogic"
readme = "README.md"
dependencies = [
  # Allow human-readable names in rule selectors
  "ruff >=0.15.20", # Keep in sync with required-version in ruff.toml
]

[tool.setuptools.data-files]
"Beslogic-Ruff-Config" = ["ruff.toml"] # installs to <venv>/Beslogic-Ruff-Config/

[tool.setuptools_scm]
# Same day as last tag: bump .N, otherwise the commit's date. Matches the tag workflow.
version_scheme = "calver-by-date"

[dependency-groups]
dev = ["dprint-py >=0.50.2.0"]

[tool.uv]
exclude-newer = "1 week"
# https://github.com/astral-sh/uv/security/advisories/GHSA-hq85-5cpj-mr62
required-version = ">=0.13.4"
